title: Raffaele P. — ML Projects
description: Applied ML · domain-driven AI systems
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# Keep build tooling and design docs out of the generated site. docs/ holds
# specs/plans whose fenced Liquid examples would otherwise break the build.
exclude:
  - docs/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - .superpowers/

collections:
  projects:
    output: true
    permalink: /projects/:name/
  writing:
    output: true
    permalink: /writing/:name/
  papers:
    output: true
    permalink: /papers/:name/
