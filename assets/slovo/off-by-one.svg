<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>

  <text x="80" y="34" font-size="15" font-weight="700" fill="#2d3b46">One review, one bucket boundary</text>
  <text x="80" y="58" font-size="13" fill="#5b6b78">bucket = floor( (reviewed_at − graduated_at) / 1 day )</text>

  <!-- bucket strip -->
  <rect x="80" y="150" width="300" height="40" fill="#f3f4f6"/>
  <rect x="80" y="150" width="600" height="40" fill="none" stroke="#c2c7cd" stroke-width="1.5"/>
  <line x1="380" y1="138" x2="380" y2="204" stroke="#9aa7b0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="380" y="130" font-size="12" fill="#7a8690" text-anchor="middle">boundary at 1.0 day</text>
  <text x="110" y="176" font-size="14" fill="#7a8690">g0</text>
  <text x="396" y="176" font-size="14" fill="#7a8690">g1</text>

  <!-- axis numbers -->
  <text x="80"  y="220" font-size="12" fill="#7a8690" text-anchor="middle">0.0</text>
  <text x="380" y="220" font-size="12" fill="#7a8690" text-anchor="middle">1.0</text>
  <text x="680" y="220" font-size="12" fill="#7a8690" text-anchor="middle">2.0</text>
  <text x="380" y="242" font-size="12" fill="#9aa7b0" text-anchor="middle">days since graduation</text>

  <!-- bug marker: a hair left of the boundary, lands in g0 -->
  <line x1="372" y1="170" x2="300" y2="112" stroke="#c0392b" stroke-width="1"/>
  <circle cx="372" cy="170" r="6" fill="#c0392b"/>
  <text x="300" y="100" font-size="12.5" font-weight="600" fill="#c0392b" text-anchor="end">integer: 0.9999 → g0  ✗</text>
  <text x="300" y="116" font-size="11.5" fill="#c0392b" text-anchor="end">(two now() calls, ~1 ms apart)</text>

  <!-- fixed marker: mid-bucket, lands in g1 -->
  <line x1="530" y1="170" x2="548" y2="112" stroke="#2f8f5b" stroke-width="1"/>
  <circle cx="530" cy="170" r="6" fill="#2f8f5b"/>
  <text x="548" y="100" font-size="12.5" font-weight="600" fill="#2f8f5b" text-anchor="start">half-day: 1.5 → g1  ✓</text>
  <text x="548" y="116" font-size="11.5" fill="#2f8f5b" text-anchor="start">(graduate −40 d, review −38.5 d)</text>

  <text x="380" y="276" font-size="12" fill="#7a8690" text-anchor="middle">The same one-bucket slip hits every integer offset; half-day offsets (1.5, 2.5, 3.5) stay clear.</text>
</svg>
